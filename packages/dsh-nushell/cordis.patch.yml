# @lzhida/dsh-nushell 组合包:一次安装即得完整替换形态——
# tool(模型契约)+ sandbox 执行器(confining,permission 选择器可用),
# 并停用官方 shell 家族与官方 bash/pwsh 工具。对齐官方 agent-team-profile
# 的「单包安装、patch 一次接线」模式。
#
# 注意:
# 1. 本包与独立的 dsh-nushell-local / dsh-nushell-sandbox 互斥(条目 id
#    冲突),二选一;
# 2. 直跑模式(官方 permission 栈与 shell 家族保真)请单装
#    @lzhida/dsh-tool-nushell;
# 3. 非 confining 形态(明确不要沙箱)请改用 @lzhida/dsh-nushell-local
#    (需按其 README 搭配停用 permission presets)。

- id: pwsh-sandbox
  disabled: true

- id: bash-sandbox
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-bash
  disabled: true

- insert:
    - id: tool-nushell
      name: '@lzhida/dsh-tool-nushell'
    - id: nushell-sandbox
      name: '@lzhida/dsh-nushell-sandbox'
