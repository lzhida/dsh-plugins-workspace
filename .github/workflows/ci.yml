# CI 流水线：镜像本地门禁链 format:check → lint → typecheck → test。
# 触发：push 与 pull_request 面向 main（发布线）/ dev（集线）；workflow_dispatch 供手动触发。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 最小权限：只读检出即可完成全部门禁
permissions:
  contents: read

# 同一分支有新提交时取消进行中的旧运行，节省 CI 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # 单个 Node 版本失败不取消其余版本，完整暴露兼容性问题
      fail-fast: false
      matrix:
        # 22 = engines 下限；24 = 当前 LTS
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # 从根 package.json 的 packageManager 字段读取 pnpm 版本（pnpm@11.10.0）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败，不静默更新
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 以下顺序与本地提交前门禁链一致（见 AGENTS.md、lefthook pre-push）
      - name: 格式检查
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test
